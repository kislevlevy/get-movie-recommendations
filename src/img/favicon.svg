<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .film-reel { fill: #2c3e50; }
      .film-holes { fill: #ecf0f1; }
      .center-circle { fill: #34495e; }
      .highlight { fill: #3498db; }
    </style>
  </defs>
  
  <!-- Main film reel circle -->
  <circle cx="16" cy="16" r="15" class="film-reel"/>
  
  <!-- Film holes around the edge -->
  <circle cx="16" cy="4" r="2" class="film-holes"/>
  <circle cx="16" cy="28" r="2" class="film-holes"/>
  <circle cx="4" cy="16" r="2" class="film-holes"/>
  <circle cx="28" cy="16" r="2" class="film-holes"/>
  <circle cx="10.4" cy="6.6" r="1.5" class="film-holes"/>
  <circle cx="21.6" cy="6.6" r="1.5" class="film-holes"/>
  <circle cx="25.4" cy="10.4" r="1.5" class="film-holes"/>
  <circle cx="25.4" cy="21.6" r="1.5" class="film-holes"/>
  <circle cx="21.6" cy="25.4" r="1.5" class="film-holes"/>
  <circle cx="10.4" cy="25.4" r="1.5" class="film-holes"/>
  <circle cx="6.6" cy="21.6" r="1.5" class="film-holes"/>
  <circle cx="6.6" cy="10.4" r="1.5" class="film-holes"/>
  
  <!-- Center hub -->
  <circle cx="16" cy="16" r="6" class="center-circle"/>
  <circle cx="16" cy="16" r="3" class="highlight"/>
  
  <!-- Spokes -->
  <rect x="15" y="10" width="2" height="12" class="highlight"/>
  <rect x="10" y="15" width="12" height="2" class="highlight"/>
</svg>
